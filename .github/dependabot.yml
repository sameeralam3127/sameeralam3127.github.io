version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint and @astrojs/check support TypeScript <6.1; bump
      # together with them once they support TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Types must match the Node runtime in .nvmrc (22.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      lint-and-test:
        patterns:
          [
            "eslint*",
            "@eslint/*",
            "typescript-eslint",
            "globals",
            "prettier*",
            "vitest",
            "@playwright/test",
          ]
      styles:
        patterns: ["tailwindcss", "@tailwindcss/*", "@fontsource-variable/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
